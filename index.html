<title>smarchone: golden convo</title>
<style>
:root {
  --bg: #0c0d10; --panel: #131419; --sunken: #1a1c22;
  --ink: #e8e9ed; --ink-2: #c4c7cf; --ink-3: #7d828e; --line: #23262e;
  --accent: #aab4ff; --accent-ink: #0c0d10; --accent-soft: rgba(170,180,255,.10);
  --accent-line: rgba(170,180,255,.35);
  --good: #7fd1a0; --good-soft: rgba(127,209,160,.10); --heart: #e06c75;
  --v1: #f0a35e; --v2: #5fc9b8; --v3: #a99cf2; --v4: #e58fb0; --v5: #7fb6f0; --v6: #d7c46a;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);
  --pop-shadow: 0 16px 40px rgb(0 0 0 / .5);
  --radius: 12px;
  --side: 256px;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
button { font: inherit; color: inherit; }
code, pre { font-family: var(--mono); font-size: 13px; }
a { color: inherit; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { display: block; flex: none; }

/* ---------- App header ---------- */
.app-head {
  position: relative;
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 28px 12px 0;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  min-height: 57px;
}
.home {
  width: var(--side);
  padding-left: 22px;
  margin-right: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 650;
  font-size: 15.5px;
  letter-spacing: -.01em;
  color: var(--ink);
  text-decoration: none;
  flex: none;
}
.home:hover { color: var(--accent); }
.home .dim { color: var(--ink-3); font-weight: 500; }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; }
.crumb-sep { color: var(--ink-3); }
.crumb-title { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumb-model { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; flex: none; font-family: var(--mono); }
.grow { flex: 1; }
.head-ctl { display: flex; align-items: center; gap: 10px; flex: none; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 520;
  white-space: nowrap; text-decoration: none; color: var(--ink-2);
  transition: border-color .15s, color .15s, background .15s;
}
.btn:hover { border-color: var(--ink-3); color: var(--ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-3); }
.btn.ghost:hover { background: var(--sunken); color: var(--ink); }
.btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }

.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.seg button {
  font-size: 12.5px;
  font-weight: 520;
  color: var(--ink-3);
  background: transparent;
  border: 0;
  border-radius: 999px;
  padding: 5px 13px;
  cursor: pointer;
  transition: color .15s, background .15s, box-shadow .15s;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] {
  color: var(--accent-ink);
  background: var(--accent);
  font-weight: 600;
  box-shadow: 0 1px 3px rgb(0 0 0 / .35);
}

.count { font: 12px var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.keyhint { font: 12px var(--sans); color: var(--ink-3); white-space: nowrap; }
.k-tap { display: none; }
@media (hover: none) and (pointer: coarse) { .k-key { display: none; } .k-tap { display: inline; } }
.focus-btn { padding: 6px 8px; }
.focus-key { font: 10.5px var(--mono); color: var(--ink-3); opacity: .75; }

.prog {
  position: absolute; left: 0; bottom: -1px; z-index: 5;
  height: 2px; width: 0; background: var(--accent); opacity: .75;
  pointer-events: none;
}
.prog.sliding { transition: width .18s ease; }

/* ---------- Try-slide hint ---------- */
.seg { position: relative; }
.try-slide {
  position: absolute; top: calc(100% + 12px); right: 0; z-index: 20;
  width: 248px; padding: 12px 14px;
  background: var(--panel); border: 1px solid var(--accent-line); border-radius: 10px;
  box-shadow: var(--pop-shadow);
  font-size: 13px; line-height: 1.45; color: var(--ink-2); white-space: normal;
}
.try-slide::before {
  content: ""; position: absolute; top: -6px; right: 30px;
  width: 10px; height: 10px; transform: rotate(45deg);
  background: var(--panel); border-left: 1px solid var(--accent-line); border-top: 1px solid var(--accent-line);
}
.try-slide b { color: var(--ink); font-weight: 600; }
.try-slide .k-key, .try-slide .k-tap { white-space: nowrap; color: var(--ink); }
.try-slide .row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
.try-slide .row button { padding: 4px 10px; font-size: 12.5px; }
.try-slide [data-view] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .try-slide { animation: tip-in .25s ease-out both .6s; }
  @keyframes tip-in { from { opacity: 0; transform: translateY(-4px); } }
}

/* ---------- Index ---------- */
.index-wrap { max-width: 720px; margin: 0 auto; padding: 48px 28px 72px; }
.hero {
  margin: 0 0 32px;
  font: 700 clamp(28px, 5vw, 38px)/1.12 var(--sans);
  color: var(--ink);
  letter-spacing: -.03em;
  text-wrap: balance;
}
.hero em { font-style: normal; color: var(--accent); }
.install-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; padding: 16px 28px 0; }
@media (min-width: 1120px) {
  .install-wrap { position: fixed; right: 28px; top: 24px; padding: 0; z-index: 5; }
}
.install-note { display: inline-flex; align-items: center; gap: 6px; font: 11.5px/1 var(--sans); color: var(--ink-3); }
.install-note a { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); text-decoration: none; }
.install-note a:hover { color: var(--accent); }
.install-cmd {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 6px 8px 6px 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  font: 12px/1 var(--mono); color: var(--ink-2); max-width: 100%;
}
.install-cmd code { font-size: 12px; color: var(--ink); overflow-x: auto; white-space: nowrap; }
.install-cmd button {
  border: 1px solid var(--line); background: var(--sunken); color: var(--ink-2);
  border-radius: 6px; padding: 4px 9px; font: 520 11.5px/1 var(--sans); cursor: pointer;
  transition: color .15s, border-color .15s;
}
.install-cmd button:hover { color: var(--accent); border-color: var(--accent-line); }

.eyebrow {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .08em; color: var(--ink-3); margin: 0 0 10px;
}
.list { list-style: none; padding: 0; margin: 0 0 40px; border-top: 1px solid var(--line); }
.entry {
  position: relative; padding: 16px 0; border-bottom: 1px solid var(--line);
  display: grid; gap: 5px; min-width: 0;
}
.entry h2 { font: 600 15.5px/1.4 var(--sans); color: var(--ink); margin: 0; text-wrap: balance; }
.entry h2 a { text-decoration: none; transition: color .15s; }
.entry h2 a::after { content: ""; position: absolute; inset: 0; }
.entry:hover h2 a { color: var(--accent); }
.entry .meta {
  display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center;
  font-size: 12px; color: var(--ink-3); margin-top: 3px;
  position: relative; z-index: 1; pointer-events: none;
}
.tags { display: flex; flex-wrap: wrap; gap: 6px 10px; }
.tag {
  font: 12px/1 var(--mono); color: var(--ink-3); background: transparent;
  cursor: pointer; border: 0; border-radius: 4px; padding: 2px 0;
  pointer-events: auto; transition: color .15s;
}
.tag::before { content: "#"; opacity: .55; }
.tag:hover, .tag[aria-pressed="true"] { color: var(--accent); }
.filter-note { font-size: 13px; color: var(--ink-2); margin: 0 0 20px; display: flex; align-items: center; gap: 8px; }
.filter-note button {
  font: inherit; color: var(--accent); background: var(--accent-soft);
  border: 0; border-radius: 6px; cursor: pointer; padding: 3px 9px; font-size: 12.5px;
}
.filter-note button:hover { background: rgba(170,180,255,.18); }

.foot {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 12.5px; color: var(--ink-3); padding: 18px 0 0;
}
.foot a { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); text-decoration: none; }
.foot a:hover { color: var(--accent); }
.foot .heart { color: var(--heart); }

/* ---------- Reading layout & stealth minimap ---------- */
body.reading { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
body.reading #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.layout { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }

.toc {
  display: none;
  position: fixed;
  left: 16px;
  top: 240px;
  width: 180px;
  max-height: calc(100dvh - 264px); z-index: 10;
  overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
  opacity: .22; transition: opacity .2s ease;
}
[data-viewing="slide"] .toc { top: 85px; max-height: calc(100dvh - 112px); }
.toc:hover, .toc:focus-within { opacity: .92; }
@media (min-width: 1280px) { .toc { display: block; } }
.toc::-webkit-scrollbar { display: none; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc button {
  display: block; width: 100%; text-align: left;
  font: 11.5px/1.45 var(--sans); color: var(--ink-3);
  background: none; border: 0; border-radius: 6px;
  padding: 4px 8px; cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color .15s, background .15s;
}
.toc button:hover { color: var(--ink); background: var(--sunken); }
.toc > ol > li.on > button { color: var(--ink); background: var(--panel); font-weight: 520; }
.toc > ol > li.g > button { position: relative; padding-left: 15px; }
.toc > ol > li.g > button::before {
  content: ""; position: absolute; left: 5px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
}
.toc .secs { display: none; padding: 2px 0 6px 10px; }
.toc li.on .secs { display: block; }
.toc .secs button { font-size: 11px; color: var(--ink-3); padding: 2px 8px; }
.toc .secs li.on button { color: var(--accent); }

.peek {
  position: fixed; z-index: 40; padding: 8px 12px; border-radius: 8px; pointer-events: none;
  background: var(--panel); border: 1px solid var(--line); box-shadow: var(--pop-shadow);
  font: 12.5px/1.5 var(--sans); color: var(--ink); overflow-wrap: anywhere;
}
.peek span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
@media (prefers-reduced-motion: no-preference) { .peek:not([hidden]) { animation: peek .14s ease-out; } @keyframes peek { from { opacity: 0; } } }

.post-intro { margin: 0 0 18px; display: grid; gap: 10px; }
.post-intro h1 {
  margin: 0; font: 700 clamp(22px, 3vw, 28px)/1.2 var(--sans);
  color: var(--ink); letter-spacing: -.025em; text-wrap: balance;
}
.post-intro .tags { gap: 6px 12px; }

.details {
  margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px 28px;
}
.colophon {
  margin: 0; font: 11.5px/1.6 var(--mono); color: var(--ink-3);
  display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 14px;
}
.colophon dt { text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; }
.colophon dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.details-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 12.5px; color: var(--ink-3); }
.agent-link { font: 12px/1.4 var(--mono); color: var(--ink-3); text-decoration: none; }
.agent-link:hover { color: var(--accent); }

/* ---------- Reading pane & Transcript: minutes, not a chat ---------- */
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.screen {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
.screen:focus { outline: none; }

.transcript {
  --gutter: 108px;
  max-width: 960px;
  margin: 0 auto;
  padding: 28px 28px 80px;
  display: flex;
  flex-direction: column;
}
.turn {
  position: relative;
  padding: 18px 0 18px var(--gutter);
  border-top: 1px solid var(--line);
  font-size: 15px;
  line-height: 1.65;
  scroll-margin-top: 16px;
}
.turn:first-child { border-top: 0; }
.turn .who {
  position: absolute; left: 0; top: 19px;
  width: calc(var(--gutter) - 16px);
  display: flex; flex-direction: column; gap: 3px;
}
.turn .role {
  font-size: 10.5px; font-weight: 650; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-3); line-height: 1.4;
}
.turn.user .role { color: var(--ink); }
.turn-num {
  font: 11px/1.3 var(--mono); color: var(--ink-3); opacity: .75;
  text-decoration: none; width: fit-content;
}
.turn-num:hover { color: var(--accent); opacity: 1; }
.golden-chip {
  font: 600 9.5px/1.2 var(--mono); color: var(--accent);
  text-transform: uppercase; letter-spacing: .08em; margin-top: 2px;
}

.expanded .turn.golden {
  margin-left: -16px;
  padding-left: calc(var(--gutter) + 14px);
  border-left: 2px solid var(--accent);
  background: linear-gradient(90deg, var(--accent-soft), transparent 65%);
}
.expanded .turn.golden .who { left: 14px; }

.prompt { color: var(--ink); font-weight: 450; overflow-wrap: anywhere; }
.prompt > :first-child { margin-top: 0; }
.prompt > :last-child { margin-bottom: 0; }
.prompt p { margin: 0 0 .6em; }
.prompt code { background: var(--sunken); padding: 1px 5px; border-radius: 4px; }

.out { color: var(--ink-2); overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol { margin: 0 0 .75em; }
.md ul, .md ol { padding-left: 1.35em; }
.md li { margin: .2em 0; }
.md li > p { margin: 0; }
.md strong, .md b { color: var(--ink); font-weight: 600; }
.md em { color: var(--ink); }
.md h1 { font-size: 19px; letter-spacing: -.015em; margin: 20px 0 8px; color: var(--ink); font-weight: 650; }
.md h2 { font-size: 16.5px; letter-spacing: -.01em; margin: 18px 0 6px; color: var(--ink); font-weight: 600; }
.md h3, .md h4 { font-size: 15px; margin: 14px 0 4px; color: var(--ink); font-weight: 600; }
.md pre { background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; margin: 0 0 .85em; overflow-x: auto; line-height: 1.5; }
.md code { background: var(--sunken); padding: 1.5px 5px; border-radius: 4px; color: var(--ink); }
.md pre code { background: none; padding: 0; color: var(--ink-2); }
.md table { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 6px 0 .9em; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; min-width: 7rem; }
.md th { background: var(--sunken); font-weight: 600; color: var(--ink); }
.md blockquote { margin: 0 0 .8em; padding: 2px 14px; border-left: 3px solid var(--line); color: var(--ink-2); }
.md blockquote p { margin: 4px 0; }
.md a { color: var(--accent); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }

.ctx {
  font-size: 13px; line-height: 1.5; color: var(--ink-3);
  margin: 0 0 12px; padding: 7px 12px;
  background: var(--panel); border-left: 2px solid var(--line); border-radius: 0 6px 6px 0;
  overflow-wrap: anywhere;
}
.ctx b { color: var(--ink-2); font-weight: 500; }
.fold[open] + .turn .ctx { display: none; }

/* ---------- Folded non-golden runs ---------- */
.fold { margin: 12px 0; }
.fold:first-child { margin-top: 0; }
.fold > summary {
  list-style: none; cursor: pointer;
  font: 12.5px/1 var(--sans); color: var(--ink-3);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 14px; display: flex; gap: 10px; align-items: center;
  transition: color .15s, border-color .15s;
}
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before { content: "▸"; color: var(--ink-3); transition: transform .15s; font-size: 11px; }
.fold[open] > summary::before { transform: rotate(90deg); }
.fold > summary:hover { color: var(--ink-2); border-color: var(--ink-3); }
.fold[open] > summary { margin-bottom: 8px; }
.fold .turn:first-of-type { border-top: 0; }

/* ---------- Brief & Reading cues ---------- */
.brief {
  margin: 0 0 24px;
  padding: 16px 20px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  display: grid;
  gap: 8px;
}
.brief-top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  font-size: 12px; color: var(--ink-3);
}
.brief-badge {
  font: 600 10.5px/1 var(--mono); color: var(--accent);
  text-transform: uppercase; letter-spacing: .08em;
  background: var(--accent-soft); padding: 4px 8px; border-radius: 6px;
}
.brief-why { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ink); }
.brief-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 2px; font-size: 12.5px; color: var(--ink-3); }
.brief-actions button {
  background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit;
}
.brief-actions button:hover { text-decoration: underline; }

/* Multi-voice speaker chips in the left gutter & extracted roles */
.turn.has-voices .who {
  position: static; width: auto;
  flex-direction: row; align-items: center; gap: 10px;
  margin-bottom: 10px;
}
.voice { position: relative; margin: 0 0 14px; }
.voice:last-child { margin-bottom: 0; }
.voice .chip-v {
  position: absolute; left: calc(-1 * var(--gutter)); top: 2px;
  width: calc(var(--gutter) - 16px);
  display: flex; align-items: center; gap: 6px;
  font-size: 10.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.voice .chip-v::before {
  content: ""; width: 6px; height: 6px; border-radius: 2px;
  flex: none; background: var(--vc, var(--accent));
}
.voice .chip-v span { overflow: hidden; text-overflow: ellipsis; }
.voice > :nth-child(2) { margin-top: 0; }
.voice > :last-child { margin-bottom: 0; }
.role-list { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.role-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font: 600 10.5px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase;
  color: var(--ink-2);
}
.role-pill::before {
  content: ""; width: 6px; height: 6px; border-radius: 2px;
  background: var(--vc, var(--accent)); flex: none;
}

.slide-nav {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line);
}
.end-foot {
  margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  font-size: 13px; color: var(--ink-3);
}
.end-foot a { color: var(--accent); text-decoration: none; }
.end-foot a:hover { text-decoration: underline; }

/* ---------- Slide mode ---------- */
.transcript.stage { min-height: calc(100dvh - 57px); padding-bottom: 36px; }
.stage .slide-nav { margin-top: auto; padding-top: 28px; }
.stage .turn { border-top: 0; }
.stage .turn.user {
  position: sticky; top: 0; z-index: 2;
  background: var(--bg);
  padding-top: 18px; padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
  max-height: 28vh; overflow-y: auto; scrollbar-width: none;
}
.stage .turn.assistant { padding-top: 22px; }
.hold-hint {
  display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
  margin-top: 18px; margin-left: var(--gutter);
  padding: 7px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel);
  color: var(--ink-2); font-size: 13px; cursor: pointer;
  transition: border-color .15s, color .15s;
}
.hold-hint:hover { border-color: var(--accent-line); color: var(--accent); }
.hold-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .8; }

.status-msg {
  max-width: 560px; margin: 48px auto; font-size: 14px; color: var(--ink-2);
  border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 16px 20px;
}
.status-msg a { color: var(--accent); }

@media (prefers-reduced-motion: no-preference) {
  .turn:target { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: var(--accent-soft); } }
}

@media (max-width: 820px) {
  .app-head { padding: 10px 14px; gap: 8px; }
  .home { width: auto; padding-left: 0; margin-right: 0; font-size: 14.5px; }
  .crumbs, .keyhint { display: none !important; }
  .index-wrap { padding: 28px 16px 48px; }
  .transcript { --gutter: 0px; padding: 16px 16px 48px; }
  .turn { padding: 14px 0; }
  .turn .who, .voice .chip-v { position: static; width: auto; flex-direction: row; align-items: center; gap: 10px; margin-bottom: 6px; }
  .turn.has-voices .who { margin-bottom: 8px; }
  .expanded .turn.golden { margin-left: -12px; padding-left: 10px; }
  .hold-hint { margin-left: 0; }
  .details-right { align-items: flex-start; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="gh" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></symbol></svg>

<div id="app"></div>

<script type="application/json" id="sessions"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script>
(function () {
  const REPO = 'smarchone/golden-convo', BRANCH = 'main';
  const app = document.getElementById('app');
  let sessions = [];
  let activeLabel = null;
  let showAll = false;

  // Both turn-marker formats in the repo: "### 3 · **user:**" and "**3. user:**"
  const TURN = /^(?:### (\d+) · \*\*(user|assistant):\*\*|\*\*(\d+)\. (user|assistant):\*\*)[ \t]*$/gm;

  function parse(path, raw) {
    const m = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    const fm = (m && jsyaml.load(m[1])) || {};
    const body = m ? m[2] : raw;
    const turns = [];
    let hit, last = null;
    TURN.lastIndex = 0;
    while ((hit = TURN.exec(body))) {
      if (last) last.text = body.slice(last.end, hit.index);
      last = { n: +(hit[1] || hit[3]), role: hit[2] || hit[4], end: TURN.lastIndex };
      turns.push(last);
    }
    if (last) last.text = body.slice(last.end);
    return { path, fm, turns, id: fm.id || path.split('/').pop().replace(/\.md$/, '') };
  }

  // index.json (written next to the sessions) lists them; the GitHub API listing only works while the repo is public.
  async function listPaths() {
    const idx = await fetch('index.json').catch(() => null);
    if (idx && idx.ok) return idx.json();
    const res = await fetch(`https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`);
    if (!res.ok) throw new Error(`no index.json, and the GitHub listing failed (${res.status})`);
    return (await res.json()).tree
      .filter(x => x.type === 'blob' && /^\d{4}-\d{2}\/[^/]+\.md$/.test(x.path)).map(x => x.path);
  }

  async function load() {
    const emb = document.getElementById('sessions');
    if (emb && emb.textContent.trim()) return JSON.parse(emb.textContent).map(f => parse(f.path, f.content));
    const built = await fetch('posts.json').catch(() => null);
    if (built && built.ok) return (await built.json()).map(p => ({ ...p, turns: null }));
    const paths = await listPaths();
    return Promise.all(paths.map(p => fetch(p).then(r => r.text()).then(content => parse(p, content))));
  }

  async function full(s) {
    if (s.turns) return s;
    const res = await fetch(s.path);
    if (!res.ok) throw new Error(`${s.path} (${res.status})`);
    Object.assign(s, parse(s.path, await res.text()));
    return s;
  }

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const md = s => marked.parse(s, { gfm: true, breaks: false });
  const plain = s => { const d = document.createElement('div'); d.innerHTML = md(s); return d.textContent.replace(/\s+/g, ' ').trim(); };
  const clip = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s;
  const fmtDate = d => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const monthKey = d => new Date(d).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  const readMins = turns => Math.max(1, Math.round(turns.reduce((n, t) => n + t.text.trim().split(/\s+/).length, 0) / 220));
  const VOICES = ['var(--v1)', 'var(--v2)', 'var(--v3)', 'var(--v4)', 'var(--v5)', 'var(--v6)'];
  const NON_ROLE = /^(lesson|files?|results?|summary|notes?|warning|tip|examples?|context|output|input|status|outcome|answer|question|your call|next steps?|try it|watch out|not tested|where it is|one-line version|sources?|before|after|caveat|signal|correction|sharpest question|honest risk|one line|bottom line|short answer|self-test|trade-off|choreography|orchestration|lambda|durable object)$/i;
  const NON_ROLE_PREFIX = /^(what|how|why|where|when|not|suggested|one-|to|try|watch|the|hard|extension|forced|corrected|company)\b/i;

  function sessionVoices(s) {
    if (s.voices) return s.voices;
    const counts = new Map();
    const re = /^\*\*([A-Za-z][A-Za-z0-9 _-]{1,16}):\*\*/gm;
    let multiTurn = false;
    for (const t of s.turns) {
      if (t.role !== 'assistant') continue;
      const inTurn = new Set();
      let m;
      re.lastIndex = 0;
      while ((m = re.exec(t.text))) {
        const name = m[1].trim();
        if (name.split(/\s+/).length > 2 || NON_ROLE.test(name) || NON_ROLE_PREFIX.test(name)) continue;
        inTurn.add(name);
        counts.set(name, (counts.get(name) || 0) + 1);
      }
      if (inTurn.size >= 2) multiTurn = true;
    }
    const map = new Map();
    if (multiTurn) {
      const recurring = [...counts.entries()].filter(([, c]) => c >= 2);
      if (recurring.length >= 2) {
        for (const [name] of recurring) map.set(name, VOICES[map.size % VOICES.length]);
      }
    }
    return (s.voices = map);
  }

  function formatTurnBody(text, isUser, voices) {
    const html = md(text.trim());
    if (isUser || !voices.size) return html;
    const re = /<p><strong>([A-Za-z][A-Za-z0-9 _-]{1,16}):<\/strong>\s*/g;
    const parts = [];
    let last = 0, m, curName = null;
    while ((m = re.exec(html))) {
      const name = m[1].trim();
      if (!voices.has(name)) continue;
      const chunk = html.slice(last, m.index);
      if (curName) parts.push({ name: curName, body: chunk });
      else if (chunk.trim()) parts.push({ name: null, body: chunk });
      curName = name;
      last = re.lastIndex;
    }
    if (!parts.length && !curName) return html;
    if (curName) parts.push({ name: curName, body: '<p>' + html.slice(last) });
    return parts.map(p => p.name
      ? `<div class="voice"><div class="chip-v" style="--vc:${voices.get(p.name)}"><span>${esc(p.name)}</span></div>${p.body.startsWith('<p>') ? p.body : '<p>' + p.body}</div>`
      : p.body).join('');
  }

  const FOOT_HTML = `<footer class="foot">Made with <span class="heart" aria-label="love">♥</span> · <a href="https://github.com/smarchone/skills" target="_blank" rel="noopener"><svg width="13" height="13"><use href="#gh"/></svg>@smarchone/skills</a></footer>`;

  function tagsHtml(labels) {
    return `<span class="tags">${(labels || []).map(l =>
      `<button class="tag" data-label="${esc(l)}" aria-pressed="${l === activeLabel}">${esc(l)}</button>`).join('')}</span>`;
  }

  function renderIndex() {
    document.body.classList.remove('reading');
    const shown = sessions.filter(s => !s.unlisted && (!activeLabel || (s.fm.labels || []).includes(activeLabel)));
    const groups = {};
    shown.forEach(s => (groups[monthKey(s.fm.captured)] ||= []).push(s));
    app.innerHTML = `
      <div class="install-wrap">
        <div class="install-cmd"><code>npx skills add smarchone/skills -g</code><button type="button" data-copy="npx skills add smarchone/skills -g">Copy</button></div>
        <span class="install-note">works with Claude &amp; AGY · <a href="https://github.com/smarchone/skills/tree/main/productivity/golden" target="_blank" rel="noopener"><svg width="12" height="12"><use href="#gh"/></svg>/golden</a></span>
      </div>
      <main class="index-wrap">
        <h1 class="hero">Conversations <em>worth keeping.</em></h1>
        ${activeLabel ? `<p class="filter-note">${shown.length} tagged #${esc(activeLabel)} <button data-clear>show all</button></p>` : ''}
        ${Object.entries(groups).map(([month, items]) => `
          <p class="eyebrow">${esc(month)}</p>
          <ol class="list">${items.map(s => `
            <li class="entry">
              <h2><a href="#${esc(s.id)}">${esc(s.fm.title)}</a></h2>
              <div class="meta">
                <span>${fmtDate(s.fm.captured)}</span>
                ${tagsHtml(s.fm.labels)}
              </div>
            </li>`).join('')}
          </ol>`).join('')}
        ${FOOT_HTML}
      </main>`;
    document.title = 'smarchone: golden convo';
  }

  function turnHtml(s, t, golden, ctx) {
    const id = `${s.id}-t${t.n}`;
    const roleLabel = t.role === 'user' ? 'You' : 'Agent';
    const body = formatTurnBody(t.text, t.role === 'user', sessionVoices(s));
    const hasVoices = body.includes('class="voice"');
    return `
      <section class="turn ${t.role} ${golden ? 'golden' : ''} ${hasVoices ? 'has-voices' : ''}" id="${id}">
        <div class="who">
          <span class="role">${roleLabel}</span>
          <a class="turn-num" href="#${id}">#${t.n}</a>
          ${golden ? '<span class="golden-chip">golden</span>' : ''}
        </div>
        ${ctx ? `<p class="ctx"><b>Replying to:</b> ${esc(clip(ctx, 180))}</p>` : ''}
        <div class="${t.role === 'user' ? 'prompt' : 'out md'}">${body}</div>
      </section>`;
  }

  function rolesHtml(s) {
    const voices = sessionVoices(s);
    if (!voices.size) return '';
    return `<span class="role-list">${[...voices.entries()].map(([name, c]) =>
      `<span class="role-pill" style="--vc:${c}">${esc(name)}</span>`).join('')}</span>`;
  }

  function briefHtml(s, golden) {
    const gTurns = s.turns.filter(t => golden.has(t.n));
    const fullMin = readMins(s.turns);
    const goldMin = gTurns.length ? readMins(gTurns) : fullMin;
    const hasHidden = gTurns.length > 0 && gTurns.length < s.turns.length;
    return `
      <div class="brief">
        <div class="brief-top">
          <span class="brief-badge">${hasHidden ? `${gTurns.length} golden of ${s.turns.length} turns` : `${s.turns.length} turns`}</span>
          <span>${hasHidden ? `~${goldMin} min highlights · ~${fullMin} min full` : `~${fullMin} min read`}</span>
          ${rolesHtml(s)}
        </div>
        ${s.fm.why ? `<p class="brief-why">${esc(s.fm.why)}</p>` : ''}
        ${hasHidden ? `<div class="brief-actions">
          <span>Non-golden turns are tucked away so you can read the core thread first.</span>
          <button type="button" data-toggle-all>${showAll ? 'Show highlights only' : `Expand all ${s.turns.length} turns`}</button>
        </div>` : ''}
      </div>`;
  }

  function colophonHtml(s) {
    const roles = [...sessionVoices(s).keys()];
    return `
      <div class="details">
        <dl class="colophon">
          <dt>Captured</dt><dd>${fmtDate(s.fm.captured)}</dd>
          ${s.fm.harness ? `<dt>Harness</dt><dd>${esc(s.fm.harness)} ${esc(s.fm.harness_version || '')}</dd>` : ''}
          ${s.fm.model ? `<dt>Model</dt><dd>${esc(s.fm.model)}</dd>` : ''}
          ${roles.length ? `<dt>Roles</dt><dd>${esc(roles.join(', '))}</dd>` : ''}
          ${s.fm.started ? `<dt>Started</dt><dd>${esc(s.fm.started)}</dd>` : ''}
        </dl>
        <div class="details-right">
          <a class="agent-link" href="${esc(s.id)}.md" title="Raw markdown for agents">agents: ${esc(s.id)}.md ↗</a>
          <span>${s.turns.length} turns</span>
        </div>
      </div>
      <div class="end-foot">
        <a href="#">← All conversations</a>
        ${FOOT_HTML}
      </div>`;
  }

  function transcriptHtml(s, golden) {
    const out = [
      `<header class="post-intro"><h1>${esc(s.fm.title)}</h1>${tagsHtml(s.fm.labels)}</header>`,
      briefHtml(s, golden)
    ];
    let run = [];
    const flush = () => {
      if (!run.length) return;
      const a = run[0].n, b = run[run.length - 1].n;
      out.push(`
        <details class="fold">
          <summary>${run.length === 1 ? `Turn ${a}` : `Turns ${a}–${b}`} · ${run.length} earlier/supporting</summary>
          ${run.map(t => turnHtml(s, t, false)).join('')}
        </details>`);
      run = [];
    };
    s.turns.forEach((t, i) => {
      if (!golden.has(t.n)) { run.push(t); return; }
      flush();
      const prev = s.turns[i - 1];
      const ctx = t.role === 'assistant' && prev && prev.role === 'user' && !golden.has(prev.n) ? plain(prev.text) : '';
      out.push(turnHtml(s, t, true, ctx));
    });
    flush();
    out.push(colophonHtml(s));
    return `<div class="transcript ${showAll ? 'expanded' : ''}">${out.join('')}</div>`;
  }

  function toggleHtml(s) {
    const hidden = s.turns.filter(t => !(s.fm.golden_turns || []).includes(t.n)).length;
    return hidden ? `<button class="btn" data-toggle-all aria-pressed="${showAll}">${showAll ? 'Golden only' : `All ${s.turns.length} turns`}</button>` : '';
  }

  function renderPost(s) {
    const golden = new Set(s.fm.golden_turns || []);
    document.body.classList.add('reading');
    tocStep = -1;
    app.innerHTML = `
      <header class="app-head">
        <a class="home" href="#"><span>smarchone<span class="dim">:</span> golden convo</span></a>
        <span class="crumbs">
          <span class="crumb-sep">/</span>
          <span class="crumb-title">${esc(s.fm.title)}</span>
          ${s.fm.model ? `<span class="crumb-model">${esc(s.fm.model)}</span>` : ''}
        </span>
        <span class="grow"></span>
        <div class="head-ctl">
          <span class="keyhint" hidden><span class="k-key">← / →</span><span class="k-tap">tap left · right</span></span>
          <span class="count" hidden></span>
          <span id="toggle">${toggleHtml(s)}</span>
          <span class="seg" role="group" aria-label="View">
            <button data-view="normal" aria-pressed="true">Normal</button>
            <button data-view="slide" aria-pressed="false">Slide</button>
            ${seenSlideHint() ? '' : `<div class="try-slide" role="dialog" aria-label="Try Slide mode">
              <b>Try Slide mode:</b> one exchange per screen, like a deck. Step with <span class="k-key">← →</span><span class="k-tap">a tap left or right</span>.
              <div class="row"><button class="btn ghost" data-hint-close>Not now</button><button class="btn" data-view="slide">Try it</button></div>
            </div>`}
          </span>
        </div>
        <i class="prog"></i>
      </header>
      <div class="layout" data-viewing="normal">
        ${tocHtml(s, golden)}
        <div class="peek" role="tooltip" hidden></div>
        <section class="pane">
          <div class="screen" tabindex="0">${transcriptHtml(s, golden)}</div>
        </section>
      </div>`;

    applyFolds();
    const screen = app.querySelector('.screen');
    let pending = false;
    const follow = () => {
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => {
        pending = false;
        if (!app.querySelector('.screen')) return;
        if (slideIdx < 0) { scrollProgress(); markToc(stepOfTurn(s, visibleTurn(s))); }
        markSection(s);
      });
    };
    screen.addEventListener('scroll', follow, { passive: true });
    screen.addEventListener('toggle', follow, true);
    screen.focus({ preventScroll: true });
    scrollProgress();
    document.title = s.fm.title;
  }

  function applyFolds() {
    app.querySelectorAll('.fold').forEach(d => { d.open = showAll; });
    app.querySelector('.transcript')?.classList.toggle('expanded', showAll);
  }

  let lastTracked = null;
  function track(s) {
    const path = location.pathname + (s ? '#' + s.id : '');
    if (path === lastTracked || typeof gtag !== 'function') return;
    lastTracked = path;
    gtag('event', 'page_view', { page_location: location.origin + path, page_path: path, page_title: s ? s.fm.title : 'Golden Convo' });
  }

  // Shown on up to HINT_MAX post views; trying Slide mode retires it for good.
  const HINT = 'slide_hint_seen', HINT_MAX = 3;
  const hintCount = () => +(document.cookie.match(new RegExp(`(?:^|; )${HINT}=(\\d+)`))?.[1] || 0);
  const setHintCount = n => { document.cookie = `${HINT}=${n}; max-age=${60 * 60 * 24 * 365}; path=/; SameSite=Lax`; };
  function seenSlideHint() {
    const n = hintCount();
    if (n >= HINT_MAX) return true;
    setHintCount(n + 1);
    return false;
  }
  function closeSlideHint(forGood) {
    if (forGood) setHintCount(HINT_MAX);
    app.querySelector('.try-slide')?.remove();
  }

  let slideIdx = -1, typing = null;
  const bare = h => h.replace(/\/(normal|slide)$/, '');
  const stepOfTurn = (s, n) => stepsOf(s).findIndex(st => st.some(t => t.n === n));

  const stepsOf = s => s.steps || (s.steps = s.turns.reduce((out, t) => {
    const last = out[out.length - 1];
    if (t.role === 'assistant' && last && last.length === 1 && last[0].role === 'user') last.push(t); else out.push([t]);
    return out;
  }, []));

  function slideHtml(s) {
    const steps = stepsOf(s);
    const prevDis = slideIdx <= 0 ? 'disabled' : '';
    const nextDis = slideIdx >= steps.length - 1 ? 'disabled' : '';
    return `<div class="transcript stage">
      ${steps[slideIdx].map(t => turnHtml(s, t, false)).join('')}
      <div class="slide-nav">
        <button class="btn" type="button" data-step="-1" ${prevDis}>← Previous</button>
        <span class="count">${slideIdx + 1} / ${steps.length}</span>
        <button class="btn" type="button" data-step="1" ${nextDis}>Next →</button>
      </div>
      <div class="end-foot">
        <a href="#">← All conversations</a>
        ${FOOT_HTML}
      </div>
    </div>`;
  }

  function setProgress(f) {
    const p = app.querySelector('.prog');
    if (p) p.style.width = `${Math.max(0, Math.min(1, f)) * 100}%`;
  }

  function scrollProgress() {
    const sc = app.querySelector('.screen'), max = sc.scrollHeight - sc.clientHeight;
    setProgress(max > 0 ? sc.scrollTop / max : 1);
  }

  const headsIn = el => [...el.querySelectorAll('h1, h2, h3, h4')];

  function sectionsOf(st) {
    const d = document.createElement('div');
    return st.filter(t => t.role === 'assistant').flatMap(t => {
      d.innerHTML = md(t.text.trim());
      return headsIn(d).map(h => h.textContent.trim());
    });
  }

  function tocHtml(s, golden) {
    return `<nav class="toc" aria-label="Prompts"><ol>${stepsOf(s).map((st, i) => {
      const label = plain(st[0].text), secs = sectionsOf(st);
      return `<li class="${st.some(t => golden.has(t.n)) ? 'g' : ''}">
        <button data-goto="${i}" data-peek="${esc(label)}">${esc(clip(label, 120))}</button>
        ${secs.length ? `<ol class="secs">${secs.map((h, k) => `<li><button data-sec="${i}:${k}" data-peek="${esc(h)}">${esc(h)}</button></li>`).join('')}</ol>` : ''}
      </li>`;
    }).join('')}</ol></nav>`;
  }

  let peekTimer;
  app.addEventListener('mouseover', e => {
    const b = e.target.closest('.toc button');
    if (!b) return;
    clearTimeout(peekTimer);
    if (b.scrollWidth <= b.clientWidth) return;
    peekTimer = setTimeout(() => {
      const peek = app.querySelector('.peek');
      if (!peek || !b.isConnected || !b.dataset.peek) return;
      peek.innerHTML = `<span>${esc(b.dataset.peek)}</span>`;
      peek.hidden = false;
      const toc = app.querySelector('.toc').getBoundingClientRect(), r = b.getBoundingClientRect();
      const w = Math.min(340, innerWidth - toc.right - 24);
      peek.style.left = `${toc.right + 10}px`;
      peek.style.width = `${Math.max(200, w)}px`;
      const h = peek.offsetHeight;
      peek.style.top = `${r.top + h <= innerHeight - 12 ? r.top : Math.max(12, innerHeight - 12 - h)}px`;
    }, 250);
  });
  app.addEventListener('mouseout', e => {
    if (!e.target.closest('.toc button')) return;
    clearTimeout(peekTimer);
    const peek = app.querySelector('.peek'); if (peek) peek.hidden = true;
  });

  let tocStep = -1;
  function markToc(i) {
    if (i === tocStep) return;
    tocStep = i;
    const items = app.querySelectorAll('.toc > ol > li');
    items.forEach((li, j) => li.classList.toggle('on', j === i));
    const toc = app.querySelector('.toc'), li = items[i];
    if (!li || !toc) return;
    if (li.offsetTop < toc.scrollTop) toc.scrollTop = li.offsetTop;
    else if (li.offsetTop + li.offsetHeight > toc.scrollTop + toc.clientHeight) toc.scrollTop = li.offsetTop + li.offsetHeight - toc.clientHeight;
  }

  function headsOfStep(s, i) {
    if (slideIdx >= 0) return headsIn(app.querySelector('.stage'));
    return stepsOf(s)[i].filter(t => t.role === 'assistant')
      .flatMap(t => { const el = document.getElementById(`${s.id}-t${t.n}`); return el ? headsIn(el.querySelector('.out')) : []; });
  }

  const topInset = () => (slideIdx >= 0 && app.querySelector('.stage .turn.user')?.offsetHeight) || 0;

  function markSection(s) {
    const screen = app.querySelector('.screen'), edge = screen.getBoundingClientRect().top + topInset() + 24;
    const heads = tocStep < 0 ? [] : headsOfStep(s, tocStep).filter(shown);
    let cur = -1;
    heads.forEach((h, k) => { if (h.getBoundingClientRect().top <= edge) cur = k; });
    app.querySelectorAll('.toc li.on .secs li').forEach((li, k) => li.classList.toggle('on', k === cur));
  }

  function goToStep(s, i) {
    if (slideIdx >= 0) return showSlide(s, i, false, false);
    const el = document.getElementById(`${s.id}-t${stepsOf(s)[i][0].n}`);
    if (!el) return;
    const fold = el.closest('.fold'); if (fold) fold.open = true;
    el.scrollIntoView({ block: 'start' });
  }

  function goToSection(s, i, k) {
    if (slideIdx >= 0 && slideIdx !== i) showSlide(s, i, false, false);
    typing?.finish();
    if (slideIdx < 0) stepsOf(s)[i].forEach(t => { const f = document.getElementById(`${s.id}-t${t.n}`)?.closest('.fold'); if (f) f.open = true; });
    const h = headsOfStep(s, i)[k], screen = app.querySelector('.screen');
    if (!h) return;
    screen.scrollTop += h.getBoundingClientRect().top - screen.getBoundingClientRect().top - topInset() - 16;
    markToc(i);
  }

  function updateDeck(s) {
    const count = app.querySelector('.count'), n = stepsOf(s).length;
    count.hidden = slideIdx < 0;
    app.querySelector('.keyhint').hidden = slideIdx < 0;
    if (slideIdx < 0) { scrollProgress(); markToc(stepOfTurn(s, visibleTurn(s))); markSection(s); return; }
    markToc(slideIdx); markSection(s);
    count.textContent = `${slideIdx + 1} / ${n}`;
    setProgress((slideIdx + 1) / n);
  }

  function holdReply(root) {
    const turn = root.closest('.turn');
    turn.hidden = true;
    const btn = document.createElement('button');
    btn.className = 'hold-hint';
    btn.type = 'button';
    btn.innerHTML = '<span class="hold-dot"></span><span>Press → or click to reveal reply</span>';
    btn.addEventListener('click', () => typing?.skip());
    turn.after(btn);
    const finish = () => { btn.remove(); turn.hidden = false; typing = null; };
    typing = { finish, skip: finish };
  }

  function showSlide(s, i, push, animate) {
    typing?.finish();
    const steps = stepsOf(s);
    slideIdx = Math.max(0, Math.min(steps.length - 1, i));
    const prog = app.querySelector('.prog'), screen = app.querySelector('.screen');
    prog?.classList.add('sliding');
    screen.innerHTML = slideHtml(s);
    screen.scrollTop = 0;
    updateDeck(s);
    const reply = screen.querySelector('.out');
    if (animate && reply) holdReply(reply);
    history[push ? 'pushState' : 'replaceState'](null, '', '#' + s.id + '-t' + steps[slideIdx][0].n);
    syncView();
  }

  function exitSlide(s) {
    if (slideIdx < 0) return;
    typing?.finish();
    const n = stepsOf(s)[slideIdx][0].n;
    slideIdx = -1;
    const prog = app.querySelector('.prog'), screen = app.querySelector('.screen');
    prog?.classList.remove('sliding');
    screen.innerHTML = transcriptHtml(s, new Set(s.fm.golden_turns || []));
    applyFolds(); syncView();
    history.replaceState(null, '', '#' + s.id + '-t' + n);
    const el = document.getElementById(s.id + '-t' + n);
    if (el) { const f = el.closest('.fold'); if (f) f.open = true; el.scrollIntoView({ block: 'start' }); }
    updateDeck(s);
  }

  const shown = el => !!el.offsetParent && !el.closest('details:not([open])');

  function visibleTurn(s) {
    const turns = [...app.querySelectorAll('.screen .turn')].filter(shown);
    const edge = app.querySelector('.screen').getBoundingClientRect().top + 24;
    const top = turns.find(el => el.getBoundingClientRect().bottom > edge) || turns[turns.length - 1];
    return top ? +top.id.match(/-t(\d+)$/)[1] : (s.turns[0]?.n ?? 1);
  }

  function syncView() {
    const sliding = slideIdx >= 0;
    app.querySelector('.layout').dataset.viewing = sliding ? 'slide' : 'normal';
    const tgl = document.getElementById('toggle');
    if (tgl) tgl.hidden = sliding;
    app.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === (sliding ? 'slide' : 'normal'))));
  }

  function advance(s, d) {
    if (d > 0 && typing) { typing.skip(); return; }
    if (slideIdx + d < 0 || slideIdx + d >= stepsOf(s).length) return;
    showSlide(s, slideIdx + d, false, d > 0);
  }

  const curSession = () => sessions.find(x => x.id === app.dataset.current);

  document.addEventListener('keydown', e => {
    const s = curSession();
    if (!s || e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const k = e.key;
    if (slideIdx < 0) return;
    if (k === 'ArrowRight' || k === 'j' || k === ' ' && !e.shiftKey) advance(s, 1);
    else if (k === 'ArrowLeft' || k === 'k' || k === ' ' && e.shiftKey) advance(s, -1);
    else if (k === 'Home') showSlide(s, 0);
    else if (k === 'End') showSlide(s, stepsOf(s).length - 1);
    else return;
    e.preventDefault();
  });

  app.addEventListener('click', e => {
    const s = curSession(), screen = e.target.closest('.screen');
    if (!s || slideIdx < 0 || !screen || !matchMedia('(hover:none) and (pointer:coarse)').matches
        || e.target.closest('a, button, summary, input') || String(getSelection())) return;
    const r = screen.getBoundingClientRect();
    advance(s, e.clientX < r.left + r.width / 2 ? -1 : 1);
  });

  async function route() {
    const h = bare(location.hash.slice(1));
    const s = h && sessions.find(x => h === x.id || h.startsWith(x.id + '-t'));
    track(s);
    if (s) {
      const same = app.dataset.current === s.id;
      if (!same) {
        if (!s.turns) {
          app.innerHTML = '<p class="status-msg">Loading session…</p>';
          try { await full(s); }
          catch (err) { app.innerHTML = `<p class="status-msg">Couldn't load ${esc(err.message)}. Try reloading.</p>`; app.dataset.current = ''; return; }
          if (bare(location.hash.slice(1)) !== h) return;
        }
        showAll = false; slideIdx = -1; renderPost(s); app.dataset.current = s.id;
      }
      if (slideIdx >= 0) {
        const m = h.match(/-t(\d+)$/), i = m ? stepOfTurn(s, +m[1]) : 0;
        if (i !== slideIdx) showSlide(s, Math.max(0, i), false, !m);
        return;
      }
      const el = h !== s.id && document.getElementById(h);
      if (el) { const fold = el.closest('.fold'); if (fold) fold.open = true; el.scrollIntoView({ block: 'start' }); }
      else if (!same) app.querySelector('.screen').scrollTop = 0;
    } else {
      renderIndex(); app.dataset.current = ''; window.scrollTo(0, 0);
    }
  }

  app.addEventListener('click', e => {
    const copy = e.target.closest('[data-copy]');
    if (copy) {
      navigator.clipboard?.writeText(copy.dataset.copy).then(() => {
        copy.textContent = 'Copied';
        setTimeout(() => { copy.textContent = 'Copy'; }, 1500);
      });
      return;
    }
    const tag = e.target.closest('.tag');
    if (tag) {
      activeLabel = activeLabel === tag.dataset.label ? null : tag.dataset.label;
      if (location.hash.length > 1) location.hash = ''; else renderIndex();
      return;
    }
    if (e.target.closest('[data-clear]')) { activeLabel = null; renderIndex(); return; }
    const s = sessions.find(x => x.id === app.dataset.current);
    if (e.target.closest('[data-hint-close]')) { closeSlideHint(false); app.querySelector('.screen')?.focus({ preventScroll: true }); return; }
    const view = e.target.closest('[data-view]');
    if (s && view) {
      closeSlideHint(true);
      if (view.dataset.view === 'slide' && slideIdx < 0) { const n = visibleTurn(s); showSlide(s, Math.max(0, stepOfTurn(s, n)), true, true); }
      else if (view.dataset.view === 'normal') exitSlide(s);
      app.querySelector('.screen').focus({ preventScroll: true });
      return;
    }
    const sec = e.target.closest('[data-sec]');
    if (s && sec) { const [i, k] = sec.dataset.sec.split(':').map(Number); goToSection(s, i, k); app.querySelector('.screen').focus({ preventScroll: true }); return; }
    const go = e.target.closest('[data-goto]');
    if (s && go) { goToStep(s, +go.dataset.goto); app.querySelector('.screen').focus({ preventScroll: true }); return; }
    const stepBtn = e.target.closest('[data-step]');
    if (s && stepBtn) { advance(s, +stepBtn.dataset.step); app.querySelector('.screen').focus({ preventScroll: true }); return; }
    if (e.target.closest('[data-toggle-all]') && s) {
      showAll = !showAll; applyFolds();
      document.getElementById('toggle').innerHTML = toggleHtml(s);
      const b = app.querySelector('.brief');
      if (b) b.outerHTML = briefHtml(s, new Set(s.fm.golden_turns || []));
      app.querySelector('.screen').focus({ preventScroll: true });
    }
  });

  load().then(list => {
    sessions = list.sort((a, b) => new Date(b.fm.captured) - new Date(a.fm.captured));
    window.addEventListener('hashchange', route);
    route();
  }).catch(err => {
    app.innerHTML = `<p class="status-msg">Couldn't load sessions: ${esc(err.message)}. Try reloading, or browse them on <a href="https://github.com/${REPO}">GitHub</a>.</p>`;
  });
  app.innerHTML = '<p class="status-msg">Loading sessions…</p>';
})();
</script>
</body>
</html>
